name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["trunk"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pdm install

      - name: Lint with PDM
        run: pdm run lint

      - name: Test with PDM
        run: pdm run test
